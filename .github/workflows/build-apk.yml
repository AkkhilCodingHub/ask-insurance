name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Root & Workspace Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Export Expo Assets & Bundle
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://ask-insurance.onrender.com
        run: npx expo export --no-bytecode || true

      - name: Build Release APK via Gradle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p apk-output
          cp mobile/android/app/build/outputs/apk/release/*.apk apk-output/ask-insurance-release.apk || cp mobile/android/app/build/outputs/apk/*/*.apk apk-output/ || true
          ls -la apk-output/

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ask-insurance-standalone-apk
          path: apk-output/*.apk
          retention-days: 14
