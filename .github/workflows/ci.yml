name: CI & Build Verification

on:
  push:
    branches: [ main, develop, "fix/*", "feat/*" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. API Backend Validation ──────────────────────────────────────────────
  verify-api:
    name: Verify API Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://root:rootpassword@127.0.0.1:3306/ask_insurance' }}
        run: npx prisma generate

      - name: Typecheck API
        working-directory: api
        run: npx tsc --noEmit

      - name: Build API
        working-directory: api
        run: npx tsc

  # ── 2. Admin Portal Validation ─────────────────────────────────────────────
  verify-admin:
    name: Verify Admin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck Admin Portal
        working-directory: admin
        run: npx tsc --noEmit

      - name: Build Admin Next.js App
        working-directory: admin
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://ask-insurance.onrender.com' }}
        run: npm run build

  # ── 3. Customer Web App Validation ─────────────────────────────────────────
  verify-web:
    name: Verify Customer Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck Web App
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Customer Web Next.js App
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://ask-insurance.onrender.com' }}
        run: npm run build

  # ── 4. Mobile App Validation ───────────────────────────────────────────────
  verify-mobile:
    name: Verify Mobile App (React Native / Expo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck Mobile App
        working-directory: mobile
        run: npx tsc --noEmit

  # ── 5. Security & Dependency Audit ─────────────────────────────────────────
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit Monorepo Dependencies
        run: npm audit --audit-level=critical || true

      - name: Audit Mobile Dependencies
        working-directory: mobile
        run: npm audit --audit-level=critical || true
