name: CI & Build Verification

on:
  push:
    branches: [ main, develop, "fix/*", "feat/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  typecheck-and-build:
    name: Typecheck & Build Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://root:rootpassword@127.0.0.1:3306/ask_insurance' }}
        run: npx prisma generate

      - name: Typecheck API Backend
        run: cd api && npx tsc --noEmit

      - name: Typecheck Admin Web Panel
        run: cd admin && npx tsc --noEmit

      - name: Typecheck Mobile App
        run: cd mobile && npm install --legacy-peer-deps && npx tsc --noEmit

      - name: Typecheck Customer Web App
        run: cd web && npx tsc --noEmit

      - name: Build Admin Panel
        run: cd admin && npm run build

      - name: Build Web App
        run: cd web && npm run build

      - name: Build API Backend
        run: cd api && npx tsc

  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run Security Audit Check
        run: npm audit --audit-level=critical || true

