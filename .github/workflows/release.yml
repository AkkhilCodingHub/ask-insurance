name: Pre-Release & Build Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.1)'
        required: true
        default: 'v1.3.1'
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        required: true
        default: true
      release_notes_summary:
        description: 'Optional custom release highlights (markdown)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  # 🔒 1. API Quality & Build Check 🔒
  verify-api:
    name: Check API Backend
    runs-on: ubuntu-latest
    environment: Production - ask-insurance-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Shared Package
        run: npm run build --workspace=shared

      - name: Prisma Schema Validation & Generate
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://root:rootpassword@127.0.0.1:3306/ask_insurance' }}
        run: npx prisma generate

      - name: Typecheck API
        working-directory: api
        run: npx tsc --noEmit

      - name: Build API
        working-directory: api
        run: npm run build || npx tsc

  # 🔒 2. Admin Portal Quality & Build Check 🔒
  verify-admin:
    name: Check Admin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Shared Package
        run: npm run build --workspace=shared

      - name: Typecheck Admin Portal
        working-directory: admin
        run: npx tsc --noEmit

      - name: Build Admin Next.js App
        working-directory: admin
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://ask-insurance.onrender.com' }}
        run: npm run build

  # 🔒 3. Customer Web App Quality & Build Check 🔒
  verify-web:
    name: Check Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Shared Package
        run: npm run build --workspace=shared

      - name: Typecheck Web App
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Customer Web Next.js App
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://ask-insurance.onrender.com' }}
        run: npm run build

  # 🔒 4. Mobile App Quality & Verification Check 🔒
  verify-mobile:
    name: Check Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck Mobile TypeScript
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Export Mobile Bundle & Assets Validation
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://ask-insurance.onrender.com' }}
        run: npx expo export --no-bytecode || true

  # 🤖 5. Build Android Release Bundle (.aab & .apk) 🤖
  build-android:
    name: Build Android Bundle (.aab & .apk)
    needs: [verify-api, verify-admin, verify-web, verify-mobile]
    runs-on: ubuntu-latest
    environment: Production - ask-insurance-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Setup Production Env & Keystore
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL || 'https://ask-insurance.onrender.com' }}" > .env.production
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL || 'https://ask-insurance.onrender.com' }}" > .env
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi

      - name: Build Android App Bundle (.aab) & Release APK (.apk)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Prepare Artifacts for Release
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab artifacts/ask-insurance-release.aab || cp mobile/android/app/build/outputs/bundle/release/*.aab artifacts/ask-insurance-release.aab || true
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/ask-insurance-release.apk || cp mobile/android/app/build/outputs/apk/release/*.apk artifacts/ask-insurance-release.apk || true
          ls -lh artifacts/

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-binaries
          path: artifacts/*
          retention-days: 7

  # 🍏 6. Build iOS Release Package (.ipa) via EAS 🍏
  build-ios:
    name: Build iOS Production (.ipa)
    needs: [verify-api, verify-admin, verify-web, verify-mobile]
    runs-on: ubuntu-latest
    environment: Production - ask-insurance-admin
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build iOS Production IPA on EAS & Download
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || vars.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning ::EXPO_TOKEN is not configured in repository secrets. Skipping iOS cloud build."
            exit 0
          fi

          mkdir -p ../ios-artifacts
          echo "Triggering EAS iOS production build..."

          BUILD_OUTPUT=$(eas build --platform ios --profile production --non-interactive --wait --json 2>&1 || true)
          echo "$BUILD_OUTPUT"

          IPA_URL=$(node -e '
            try {
              const str = process.argv[1];
              const match = str.match(/\[\s*\{[\s\S]*\}\s*\]/) || str.match(/\{[\s\S]*"artifacts"[\s\S]*\}/);
              if (match) {
                const data = JSON.parse(match[0]);
                const item = Array.isArray(data) ? data[0] : data;
                const url = item?.artifacts?.buildUrl || "";
                process.stdout.write(url);
              }
            } catch (e) {}
          ' "$BUILD_OUTPUT")

          if [ -n "$IPA_URL" ] && [ "$IPA_URL" != "null" ]; then
            echo "Downloading IPA from: $IPA_URL"
            curl -fsSL -o ../ios-artifacts/ask-insurance-release.ipa "$IPA_URL"
            ls -lh ../ios-artifacts/
          else
            echo "::warning ::Could not retrieve IPA artifact URL. EAS build may have timed out or Apple credentials require configuration."
          fi

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-release-binaries
          path: ios-artifacts/*
          retention-days: 7

  # 📦 7. Publish Categorized Pre-Release 📦
  publish-release:
    name: Publish GitHub Pre-Release
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Android Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release-binaries
          path: release-assets

      - name: Download iOS Build Artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ios-release-binaries
          path: release-assets

      - name: Determine Tag Name & Release Flag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            PRERELEASE="${{ github.event.inputs.is_prerelease }}"
            CUSTOM_SUMMARY="${{ github.event.inputs.release_notes_summary }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="true"
            CUSTOM_SUMMARY=""
          fi
          TAG="${TAG:-v1.3.1}"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "custom_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$CUSTOM_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Categorized Release Notes
        id: release_notes
        env:
          CUSTOM_SUMMARY: ${{ steps.vars.outputs.custom_summary }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            GIT_RANGE="$PREV_TAG..HEAD"
            echo "Extracting categorized commits from $GIT_RANGE"
            FEAT=$(git log $GIT_RANGE --no-merges --grep="^feat" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            FIX=$(git log $GIT_RANGE --no-merges --grep="^fix" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            PERF=$(git log $GIT_RANGE --no-merges --grep="^perf\|^optimize" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            SEC=$(git log $GIT_RANGE --no-merges --grep="^sec\|^security" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            OTHER=$(git log $GIT_RANGE --no-merges --invert-grep --grep="^feat\|^fix\|^perf\|^optimize\|^sec\|^security" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null | head -n 10 || true)
          else
            echo "No previous tag found, using recent commit history"
            FEAT=$(git log HEAD -n 25 --no-merges --grep="^feat" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            FIX=$(git log HEAD -n 25 --no-merges --grep="^fix" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            PERF=$(git log HEAD -n 25 --no-merges --grep="^perf\|^optimize" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            SEC=$(git log HEAD -n 25 --no-merges --grep="^sec\|^security" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || true)
            OTHER=$(git log HEAD -n 25 --no-merges --invert-grep --grep="^feat\|^fix\|^perf\|^optimize\|^sec\|^security" --pretty=format:"  %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null | head -n 10 || true)
          fi

          cat << 'EOF' > release_body.md
          ### 🚀 ASK Insurance Release Package
          This release includes production client builds, verified backend services, and web portal builds.

          ---

          ### 📦 Downloadable Assets
          | File | Target Platform | Description |
          | :--- | :--- | :--- |
          | **`ask-insurance-release.aab`** | **Google Play Console** | Production App Bundle with Android 15 & 16 compatibility |
          | **`ask-insurance-release.apk`** | **Android Devices** | Standalone installable APK for direct installation & QA |
          | **`ask-insurance-release.ipa`** | **iOS / App Store Connect** | Production signed iOS package (when iOS build is enabled) |

          ---

          ### 📋 Highlights & Changes
          EOF

          if [ -n "$CUSTOM_SUMMARY" ]; then
            echo "" >> release_body.md
            echo "$CUSTOM_SUMMARY" >> release_body.md
            echo "" >> release_body.md
          fi

          if [ -n "$FEAT" ]; then
            echo "#### ✨ Features" >> release_body.md
            echo "$FEAT" >> release_body.md
            echo "" >> release_body.md
          fi

          if [ -n "$FIX" ]; then
            echo "#### 🐛 Bug Fixes" >> release_body.md
            echo "$FIX" >> release_body.md
            echo "" >> release_body.md
          fi

          if [ -n "$PERF" ]; then
            echo "#### ⚡ Performance & UI" >> release_body.md
            echo "$PERF" >> release_body.md
            echo "" >> release_body.md
          fi

          if [ -n "$SEC" ]; then
            echo "#### 🔒 Security & Compliance" >> release_body.md
            echo "$SEC" >> release_body.md
            echo "" >> release_body.md
          fi

          if [ -n "$OTHER" ]; then
            echo "#### 🔧 Maintenance & Updates" >> release_body.md
            echo "$OTHER" >> release_body.md
            echo "" >> release_body.md
          fi

          cat << 'EOF' >> release_body.md
          ---
          > **Verification Status**: ✅ API Typecheck & Build Passed | ✅ Admin Portal Passed | ✅ Web App Passed | ✅ Mobile Builds Verified
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "ASK Insurance ${{ steps.vars.outputs.tag_name }}"
          body_path: release_body.md
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          files: |
            release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
